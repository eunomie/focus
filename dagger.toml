[modules.dagger-dang-sdk]
source = "github.com/dagger/dang-sdk"

[modules.focus]
source = ".dagger/modules/focus"

[modules.focus.settings]
# The debug keystore is never committed -- see the module docs for why. Pass it per
# call, which leaves this file untouched:
#   dagger call focus --debug-keystore=file:$HOME/.focus/debug.jks apk export --path=/tmp/focus.apk
# Setting it here instead would work, but `dagger settings` writes into this tracked
# file, so a machine-specific path would end up committed.

[modules.android]
source = ".dagger/modules/android"

[modules.dagger-dang-sdk.as-sdk]
name = "dang"

[[modules.dagger-dang-sdk.as-sdk.modules]]
path = ".dagger/modules/focus"

[[modules.dagger-dang-sdk.as-sdk.modules]]
path = ".dagger/modules/android"
